# Default scope: cross-platform tools only (windows + darwin + linux leaves at
# the pinned tags), so a bare `ocx pull` of the default group resolves on every
# CI host. Platform-constrained tools live in the platform groups below.
[tools]
actionlint = "ocx.sh/actionlint/actionlint:1"
elvish = "ocx.sh/elvish/elvish:latest"
git-cliff = "ocx.sh/git-cliff/git-cliff:2"
hawkeye = "ocx.sh/hawkeye/hawkeye:6"
lychee = "ocx.sh/lychee/lychee:0"
nushell = "ocx.sh/nushell/nushell:latest"
shellcheck = "ocx.sh/shellcheck/shellcheck:0.11"
shfmt = "ocx.sh/shfmt/shfmt:3"
task = "ocx.sh/go-task/task:3"

# fish is a UNIX-ONLY tool: the ocx.sh/fish-shell/fish package has no windows
# leaf. Keeping it out of the default [tools] table means a whole-scope
# `ocx pull` on a Windows host does not choke on a missing windows/amd64 fish
# leaf. Unix consumers select it explicitly with `ocx run -g all …` (or
# `-g default,unix`); the Windows nu/elvish smoke pulls the default scope only,
# so it never references fish.
[group.unix.tools]
fish = "ocx.sh/fish-shell/fish:latest"

# pwsh is Linux-only HERE by choice: on Linux the locked ocx.sh/powershell/powershell
# has linux/{amd64,arm64}+libc.glibc leaves only (no musl). The locked release also
# ships darwin and windows leaves, but the macOS + Windows CI hosts use a system
# PowerShell and scope their pulls to default[,unix], so this group keeps their
# `ocx pull` from fetching it. Linux consumers select it with `ocx run -g all pwsh …`.
[group.linux.tools]
pwsh = "ocx.sh/powershell/powershell:latest"

# The nushell range install.nu declares ('# nu-range: FLOOR..CEILING'). The default [tools] nushell
# floats on latest and is locked, so the two ends of the range are pinned here and the gate and the
# suite run on both. Both ship windows, darwin and linux leaves; the group stays out of the Windows and
# macOS pulls (they scope to default[,unix]) because nothing there needs both ends.
[group.nurange.tools]
nushell-floor = "ocx.sh/nushell/nushell:0.105.1"
nushell-ceiling = "ocx.sh/nushell/nushell:0.116.1"

# The Starlight site under site/ (the /install/ section of ocx.sh): node and pnpm build it, uv runs
# the docs-quality checks' python. A separate group keeps the installer CI pulls (default[,unix|linux|
# nurange]) from fetching them; only the site workflow and `task site:*` ask for it.
[group.site.tools]
node = "ocx.sh/nodejs/node:24"
pnpm = "ocx.sh/pnpm/pnpm:11"
uv = "ocx.sh/astral-sh/uv:0"

# Records the site's docs casts (task site:casts); no Windows build, so it stays out of the default group.
[group.casts.tools]
asciinema = "ocx.sh/asciinema/asciinema:3.2"

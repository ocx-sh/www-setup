# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Nushell quality gate. The `nu` interpreter is bootstrapped from ocx.toml (binding `nushell`) via
# `ocx run`. nu-gate.nu --strict is the gate: a bare `nu --ide-check` or `nu-check` exits 0 on
# deprecations, removed commands and barewords that fall through to an external.

version: '3'

tasks:
  verify:
    desc: Nushell quality gate (scripts/nu-gate.nu --strict on the locked nu and on both ends of install.nu's nu-range)
    # install.nu declares '# nu-range: FLOOR..CEILING'; ocx.toml [group.nurange] pins both ends, so a
    # deprecation that only the newest nu prints, or a form the oldest nu cannot parse, is red here.
    cmds:
      - ocx run nushell -- nu --no-config-file scripts/nu-gate.nu --strict --allow ocx src/install.nu
      - ocx run -g nurange nushell-floor -- nu --no-config-file scripts/nu-gate.nu --strict --allow ocx src/install.nu
      - ocx run -g nurange nushell-ceiling -- nu --no-config-file scripts/nu-gate.nu --strict --allow ocx src/install.nu

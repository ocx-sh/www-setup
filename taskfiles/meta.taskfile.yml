# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Cross-cutting lint gates: workflows, markdown, license headers, link rot.

version: '3'

tasks:
  verify:
    desc: Cross-cutting lint (workflows, markdown, license, links)
    deps:
      - task: actionlint
      - task: hawkeye
      - task: markdownlint
      - task: lychee

  actionlint:
    desc: Lint GitHub Actions workflows (actionlint via ocx.toml)
    cmd: ocx run actionlint -- actionlint -color

  hawkeye:
    desc: Verify license headers (hawkeye via ocx.toml)
    cmd: ocx run hawkeye -- hawkeye check

  markdownlint:
    desc: Lint Markdown files
    # markdownlint-cli2 is npm-only (no OCX package); CI uses the action. A
    # local install is optional — skip with a warning instead of failing the
    # whole verify gate when it is absent.
    cmd: |
      if command -v markdownlint-cli2 >/dev/null 2>&1; then
        markdownlint-cli2 '**/*.md' '!CHANGELOG.md' '!node_modules' '!.git'
      elif command -v markdownlint >/dev/null 2>&1; then
        markdownlint --ignore CHANGELOG.md --ignore node_modules '**/*.md'
      else
        echo "meta.taskfile: markdownlint-cli2 not on PATH — skipping (CI is authoritative)" >&2
      fi

  lychee:
    desc: Link-check Markdown files (offline-friendly via --cache)
    cmd: ocx run lychee -- lychee --cache --no-progress README.md CHANGELOG.md .claude/rules/

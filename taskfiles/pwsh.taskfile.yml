# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# PowerShell quality gate. On Linux `pwsh` comes from ocx.toml ([group.linux], hence `-g all`;
# glibc leaves only, no musl). macOS and Windows use a system pwsh on PATH: the group is kept out of their pulls.
# PSScriptAnalyzer is pinned to one exact version, and the 5.1 parse runs in CI on windows-latest.

version: '3'

vars:
  PWSH: '{{if eq OS "linux"}}ocx run -g all pwsh -- pwsh{{else}}pwsh{{end}} -NoProfile -NonInteractive'
  PSA_VERSION: '1.25.0'

tasks:
  verify:
    desc: PowerShell quality gate (scripts/Invoke-PSGate.ps1 over src and tests; pwsh via ocx.toml on Linux)
    cmds:
      - '{{.PWSH}} -File scripts/Install-PinnedModule.ps1 -Name PSScriptAnalyzer -Version {{.PSA_VERSION}}'
      - '{{.PWSH}} -File scripts/Invoke-PSGate.ps1 -Path src -Settings PSScriptAnalyzerSettings.installer.psd1 -RequiredVersion {{.PSA_VERSION}}'
      - '{{.PWSH}} -File scripts/Invoke-PSGate.ps1 -Path tests/install/ps1 -Settings PSScriptAnalyzerSettings.test.psd1 -RequiredVersion {{.PSA_VERSION}}'

# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Fish quality gate. The `fish` interpreter is bootstrapped from ocx.toml (binding `fish`,
# [group.unix]) via `ocx run -g all`. The ocx fish package ships no fish_indent binary, so
# scripts/fish-indent.sh links the fish binary under that name (fish 4.x is multicall).

version: '3'

tasks:
  verify:
    desc: Fish quality gate (fish --no-execute, fish-scan.sh, fish_indent --check; fish via ocx.toml)
    cmds:
      - ocx run -g all fish -- fish --no-config --no-execute src/install.fish
      - ocx run -g all fish -- sh scripts/fish-scan.sh
      - ocx run -g all fish -- sh scripts/fish-indent.sh --check src/install.fish

  format:
    desc: Format install.fish with fish_indent (fish via ocx.toml)
    cmd: ocx run -g all fish -- sh scripts/fish-indent.sh --write src/install.fish

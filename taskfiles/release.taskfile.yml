# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Release flow: git-cliff bumps the version from conventional commits,
# regenerates CHANGELOG.md, commits + tags. Pushing the tag triggers
# .github/workflows/release.yml which runs publish-installers.sh.

version: '3'

tasks:
  changelog:
    desc: Update CHANGELOG.md from git history
    cmd: ocx run git-cliff -- git-cliff --output CHANGELOG.md

  changelog:preview:
    desc: Preview unreleased changes
    cmd: ocx run git-cliff -- git-cliff --unreleased

  # Version selection:
  #   task release:prepare                 # interactive menu: auto | patch | minor | major
  #   task release:prepare BUMP=minor      # skip the menu, force a bump level
  #   task release:prepare BUMP=auto VERSION=0.2.0   # pin an exact version (v prefix optional)
  #
  # BUMP is a required enum: with interactive mode on (.taskrc.yml) and a TTY it
  # renders a selection menu; on CI / no TTY it must be passed on the CLI.
  prepare:
    desc: 'Prepare a release (interactive: pick auto|patch|minor|major; or BUMP=<level> / VERSION=x.y.z)'
    preconditions:
      - sh: git diff --quiet && git diff --cached --quiet
        msg: 'Working tree must be clean'
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      # git-cliff computes the next version from git history. `auto` lets it pick
      # the bump from conventional commits; otherwise BUMP forces the level.
      # VERSION pins an exact value and wins over BUMP.
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            printf 'v%s' "{{.VERSION | default "" | trimPrefix "v"}}"
          elif [ "{{.BUMP}}" = "auto" ]; then
            ocx run git-cliff -- git-cliff --bumped-version
          else
            ocx run git-cliff -- git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      - echo "Next version:{{.NEXT_VERSION}}"
      - ocx run git-cliff -- git-cliff --tag "{{.NEXT_VERSION}}" -o CHANGELOG.md
      - task verify
      - |
        echo ""
        echo "Release prepared ({{.NEXT_VERSION}}). Review changes, then:"
        echo "  git add -A && git commit -m 'release: {{.NEXT_VERSION}}'"
        echo "  git tag {{.NEXT_VERSION}}"
        echo "  git push origin main && git push origin {{.NEXT_VERSION}}"

name: site

# The /install/ section of ocx.sh (site/). Built and checked on every PR that touches it; deployed
# to ocx.sh on a v* tag. src/install.* is a trigger because the drift guard (site/scripts/contract.test.mjs)
# compares the installers' knobs and exit codes with the pages.
on:
  pull_request:
    # ready_for_review: a draft skips Lighthouse (below), so marking it ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'site/**'
      - 'src/install.*'
      - '.claude/rules/docs-quality/**'
      - 'ocx.toml'
      - 'ocx.lock'
      - 'taskfile.yml'
      - 'taskfiles/site.taskfile.yml'
      - '.github/workflows/site.yml'
  # The docs go live with the installers they describe: a v* tag (release.yml publishes the same tag),
  # never a push to main. The `ocx.sh` environment needs a deployment rule that admits v* tags (owner setting).
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          groups: default,site
      - run: task site:check
      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist

  lighthouse:
    name: Lighthouse
    # The slowest job; drafts skip it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          groups: default,site
      # Lighthouse drives Playwright's Chromium; install its system libraries first (the task fetches only the browser).
      - name: Install Chromium system libraries
        run: ocx exec -g site -- pnpm --dir site exec playwright-core install-deps chromium
      - run: task site:lighthouse
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: site/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy
    needs: [build, lighthouse]
    # Off until the ocx.sh environment and the BUNNY_DEPLOY variable exist on this repo.
    # A tag only: a dispatch from a branch builds and checks but never deploys.
    if: vars.BUNNY_DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # The ocx.sh environment holds a BUNNY_STORAGE_KEY scoped to the ocx.sh storage zone. The
    # setup.ocx.sh environment holds a secret of the same name for another zone; the two never meet.
    environment:
      name: ocx.sh
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: ocx-sh-deploy
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - name: Deploy
        id: deploy
        uses: ocx-sh/website/.github/actions/deploy@708b79240ed9dbb39bd7b66b2c91b0ad0c6c596a # ocx-sh/website PR 21, same commit as the theme pin
        with:
          dist: dist
          storage-key: ${{ secrets.BUNNY_STORAGE_KEY }}

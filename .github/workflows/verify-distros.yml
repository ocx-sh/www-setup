name: Verify distros

# Cross-distro proof that the project toolchain bootstraps from ocx.toml inside a
# clean container and the per-shell installer suites pass there. Mirrors the
# test-docker matrix's host-orchestrated model: the job runs on the ubuntu HOST
# (so JS actions like checkout run on glibc), and each distro is exercised inside
# `docker run` — which sidesteps the well-known "node24 JS action fails on musl"
# problem that container: jobs hit on Alpine.
#
# Inside each container: install base deps (setup-distro.sh) → bootstrap ocx
# itself (install-ocx.sh) → run the Bats suites with nu/fish/elvish provisioned
# straight from ocx.toml via `ocx run`. No apt/tarball shell installs; the shells
# come from the OCX toolchain, the same way they do locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: verify-distros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distro-bats:
    name: bats / ${{ matrix.distro }}
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: alpine
            image: 'alpine:3.20'
          - distro: fedora
            image: 'fedora:41'
          - distro: ubuntu
            image: 'ubuntu:24.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # bats-ci.sh asserts the pinned bats and runs the census. The container is a root-owned
      # bind mount, so git needs the directory marked safe before the census can list files.
      # None of these distro images carries GNU wget, and Alpine has no GNU timeout either.
      - name: Bootstrap ocx.toml + run bats in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env DISTRO \
            --env OCX_TEST_REQUIRE_SHELLS=1 \
            --env 'CENSUS_SKIP_OK=GNU wget not installed|timeout[(]1[)] not available' \
            "$IMAGE" \
            sh -euc '
              sh tests/ci/setup-distro.sh "$DISTRO"
              sh tests/ci/install-ocx.sh >/dev/null
              git config --global --add safe.directory /work
              ocx run -g all nushell fish elvish -- bash scripts/bats-ci.sh
            '

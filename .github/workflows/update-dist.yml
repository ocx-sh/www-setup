name: update-dist

on:
  repository_dispatch:
    types: [ocx-released]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: dist-manifest
  cancel-in-progress: false

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    environment: setup.ocx.sh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log dispatch payload
        if: github.event_name == 'repository_dispatch'
        env:
          OCX_VERSION: ${{ github.event.client_payload.version }}
        run: echo "Refreshing dist manifest for ocx version $OCX_VERSION"

      - name: Publish dist manifest
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_COPY: ${{ runner.temp }}/dist.json
        run: scripts/publish-dist.sh

      # Runs only after the publish step succeeded (default success() gate), on
      # every trigger of this workflow; PR builds never reach it. Always fires
      # because the receivers are idempotent. A failure only warns.
      - name: Notify dist-updated receivers
        env:
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
          # Space-separated owner/repo list; add a sibling here.
          DIST_RECEIVERS: ocx-sh/devcontainer-features
          DIST_FILE: ${{ runner.temp }}/dist.json
        run: scripts/dispatch-dist-updated.sh "$DIST_FILE"

name: update-dist

on:
  repository_dispatch:
    types: [ocx-released]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: dist-manifest
  cancel-in-progress: false

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    environment: setup.ocx.sh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log dispatch payload
        if: github.event_name == 'repository_dispatch'
        run: echo "Refreshing dist manifest for ocx version ${{ github.event.client_payload.version }}"

      - name: Publish dist manifest
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-dist.sh

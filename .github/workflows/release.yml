name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine channel
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72 # v4
        with:
          # Stable releases restrict the tag boundaries to stable tags so a
          # prerelease tag (vX.Y.Z-rc.N) does not truncate --latest's range —
          # the notes then cover every commit since the previous STABLE release
          # (the rc tag is transparent). Prereleases use the default --latest.
          args: ${{ steps.channel.outputs.prerelease == 'true' && '--latest --strip header' || '--latest --tag-pattern ^v[0-9]+\.[0-9]+\.[0-9]+$ --strip header' }}
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}

      - name: Update major version tag
        if: steps.channel.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major"
          git push origin "$major" --force

  publish-installers:
    name: Publish installers to setup.ocx.sh
    needs: [release]
    runs-on: ubuntu-latest
    environment: setup.ocx.sh
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}" scripts/publish-installers.sh

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  OCX_INDEX: '{{.ROOT_DIR}}/.ocx/index'

includes:
  shell: ./taskfiles/shell.taskfile.yml
  pwsh: ./taskfiles/pwsh.taskfile.yml
  nu: ./taskfiles/nu.taskfile.yml
  fish: ./taskfiles/fish.taskfile.yml
  elvish: ./taskfiles/elvish.taskfile.yml
  test: ./taskfiles/test.taskfile.yml
  docker: ./taskfiles/docker.taskfile.yml
  release: ./taskfiles/release.taskfile.yml
  meta: ./taskfiles/meta.taskfile.yml
  # Tool registrations (backed by ocx.taskfile.yml).
  # NAME is the binding declared in ocx.toml [tools]; `ocx run NAME -- BINARY`
  # composes the toolchain env. bats is NOT registered here — it is a vendored
  # git submodule (external/bats-core), not an OCX package. markdownlint-cli2
  # is npm-only (no OCX package); CI runs it, meta:markdownlint needs a local one.
  # ShellCheck and shfmt are not registered: scripts/shell-gate.sh feeds them a git-listed file set.
  lychee:
    taskfile: ./taskfiles/ocx.taskfile.yml
    internal: true
    vars:
      NAME: lychee
      TOOL: lychee
      GLOB: '*.md'
  git-cliff:
    taskfile: ./taskfiles/ocx.taskfile.yml
    internal: true
    vars:
      NAME: git-cliff
      TOOL: git-cliff
      GLOB: 'cliff.toml'

tasks:
  ocx:lock:
    desc: Re-resolve ocx.toml tool tags to digests and materialize the object store.
    # Reads every [tools] binding from ocx.toml, resolves each tag to a digest,
    # writes ocx.lock, and pre-warms the object store. This is the single source
    # of truth for the toolchain — the shell lint/test gates bootstrap their
    # interpreters (nu/fish/elvish/pwsh) from these same bindings via `ocx run`.
    cmds:
      - ocx lock

  ocx:lock:check:
    desc: CI primitive — assert ocx.lock is current relative to ocx.toml (exit 65 if stale).
    cmds:
      - ocx lock --check

  # Two-phase verify: parallel lint, then sequential tests.
  verify:
    desc: Full quality gate (lint + bats + pester)
    summary: |
      Phase 1 (parallel): shell:verify, pwsh:verify, nu/fish/elvish:verify, meta:verify,
        ci:verify, ci:zizmor, test:pester:lint
      Phase 2 (sequential): test:bats, test:pester
    cmds:
      - task: .verify:lint
      - task: .verify:tests

  .verify:lint:
    internal: true
    deps:
      - task: shell:verify
      - task: pwsh:verify
      - task: nu:verify
      - task: fish:verify
      - task: elvish:verify
      - task: meta:verify
      - task: ci:verify
      - task: ci:zizmor
      - task: test:pester:lint

  ci:verify:
    desc: Workflow and Taskfile checks (ci-steps, ci-taint, ci-orand, ci-task-pipefail, ci-extract-lint, job and pwsh run lint)
    # ShellCheck must be on PATH: ci-extract-lint feeds it the shell bodies embedded in the Taskfiles.
    cmd: ocx run shellcheck -- bash scripts/ci-verify.sh

  ci:zizmor:
    desc: Workflow security audit (zizmor 1.30.1, regular persona, medium floor; config in zizmor.yml; CI runs it online in verify.yml)
    # uvx pins the version; --offline skips the audits that need a token (CI runs them with one).
    cmd: uvx zizmor@1.30.1 --offline --min-severity medium --config zizmor.yml .github/workflows

  .verify:tests:
    internal: true
    cmds:
      - task: test:bats
      - task: test:pester

  publish:dry-run:
    desc: Validate publish-installers.sh STABLE archive/+latest/+next Bunny keys, offline (no upload, no credentials; run 'task dist' for the manifest).
    vars:
      # Strip any leading v AND any prerelease suffix so this always exercises
      # the stable channel (which writes both the latest/ and next/ pointers).
      VERSION:
        sh: 'set -o pipefail; ocx run git-cliff -- git-cliff --bumped-version | sed "s/^v//; s/-.*//"'
    cmd: DRY_RUN=1 VERSION={{.VERSION}} scripts/publish-installers.sh

  publish:dev-dry-run:
    desc: Validate publish-installers.sh NEXT (prerelease) archive/+next Bunny keys, offline (no upload, no credentials; run 'task dist' for the manifest).
    vars:
      # Force a prerelease VERSION so the next/ channel pointers are exercised.
      # Override with VERSION=X.Y.Z-rc.N on the CLI.
      VERSION: '{{.VERSION | default "0.0.0-dev.0"}}'
    cmd: DRY_RUN=1 VERSION={{.VERSION}} scripts/publish-installers.sh

  dist:
    # Sourced from the ocx-sh/ocx GitHub Releases API (NOT this repo's tags), so
    # this makes a live api.github.com call (unauthenticated unless GITHUB_TOKEN
    # is exported; subject to the 60/hr unauth rate limit). Per release it also
    # fetches each release's sha256.sum asset to inline the per-target checksums.
    desc: Print the distribution manifest (dist.json) from the ocx-sh/ocx Releases API.
    cmd: scripts/gen-dist.sh

  rules:plan:
    desc: Print the setup.ocx.sh Bunny edge-rule set (offline, no credentials).
    dir: deploy/bunny
    cmd: python3 edge-rules.py plan

  rules:apply:
    desc: Apply the edge rules to the pull zone and purge (needs BUNNY_API_KEY).
    dir: deploy/bunny
    cmd: python3 edge-rules.py apply

  rules:verify:
    desc: Probe every routed URL against the live pull zone (needs no credentials).
    dir: deploy/bunny
    cmd: python3 edge-rules.py verify

  zone:plan:
    desc: Diff the live pull-zone resilience settings against desired (needs BUNNY_API_KEY).
    dir: deploy/bunny
    cmd: python3 edge-rules.py zone

  zone:apply:
    desc: Apply the pull-zone resilience settings and purge (needs BUNNY_API_KEY).
    dir: deploy/bunny
    cmd: python3 edge-rules.py zone-apply

  format:
    desc: Auto-format shell and fish scripts
    cmds:
      - task: shell:format
      - task: fish:format
